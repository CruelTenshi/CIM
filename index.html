<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b101a">
<title>문제 풀이</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css">
</head>
<body>
<header>
<div class="eyebrow" id="quizEyebrow"></div>
<h1 id="quizTitle"></h1>
<p class="sub" id="quizSubtitle"></p>
<div class="topmeta" id="quizChips"></div>
</header>
<section id="dbPicker" class="db-picker" aria-labelledby="dbHeading">
<div class="db-picker-head">
<div class="db-picker-intro">
<h2 id="dbHeading" tabindex="-1">풀 문제집을 선택해주세요.</h2>
<p class="small">문제집을 선택하면 바로 시작합니다. 이전에 풀었다면 저장된 상태를 이어서 엽니다.</p>
</div>
<div class="db-toolbar">
<label for="categoryFilter">분류</label>
<select id="categoryFilter" aria-controls="dbList"><option value="">전체 카테고리</option></select>
<span class="small" id="dbCount" role="status" aria-live="polite"></span>
</div>
</div>
<div id="dbList" class="db-grid"></div>
<p id="dbStatus" role="status" aria-live="polite"></p>
<div class="db-help">웹페이지 및 문제는 AI를 통해 제작되었습니다.</div>
</section>
<div id="quizView" hidden>
<div class="backbar"><button type="button" class="btn subtle" id="backToDbs">← 뒤로 가기 · 문제집 선택</button></div>
<div class="shell">
<aside><div class="panel">
<h2 class="side-title" id="sideTitle">풀이 현황</h2>
<div class="meta"><span id="progressText"></span><span class="clock" id="clock">00:00</span></div>
<progress id="progress" max="1" value="0" aria-label="응답 진행률"></progress>
<nav id="nav" class="navgrid" aria-label="문항 바로가기"></nav>
<div class="legend">채운 칸: 응답 완료 · 노란 점: 다시 확인<br>테두리: 현재 문항 · 제출 전 정답 비공개</div>
<div class="sideactions">
<button class="btn primary wide" id="submitBtn">답안 제출 · 채점</button>
<button type="button" class="btn wide" id="backupBtn">풀이 백업 · 제출 전에 저장</button>
<div class="row secondary-actions"><button class="btn subtle" id="resetBtn">전체 초기화</button><button class="btn subtle" id="exportBtn">결과 저장</button></div>
</div>
<section class="result-import" aria-labelledby="importHeading">
<div class="import-heading"><span class="file-label" aria-hidden="true">TXT</span><h3 id="importHeading">백업·결과 이어보기</h3></div>
<p class="import-hint" id="importHint">이 문제집의 풀이 백업 또는 결과 TXT로<br>답안·시간·확인 표시를 다시 불러옵니다.</p>
<button type="button" class="btn wide import-button" id="importBtn" aria-describedby="importHint"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M4 14v6h16v-6"/></svg><span>TXT 백업·결과 불러오기</span></button>
<input type="file" id="importFile" accept=".txt,text/plain" hidden>
<p class="import-status" id="importStatus" role="status" aria-live="polite"></p>
</section>
<p id="restoreStatus" role="status" aria-live="polite"></p>
<div class="sidefoot" id="saveStatus" role="status" aria-live="polite">이 브라우저에 자동 저장합니다.<br>키보드 1~4: 답 선택 · ← →: 문항 이동<br>시간은 창이 보이는 동안만 누적됩니다.</div>
</div></aside>
<main>
<section id="summary" aria-label="채점 결과" hidden></section>
<div id="filters" aria-label="문항 필터"></div>
<div id="question"></div>
<div id="quizStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="quizNotes"></div>
<p class="notice" id="quizNotice"></p>
</main></div>
</div>
<dialog id="modal"><h2 id="modalTitle"></h2><p id="modalBody"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="modalCancel">취소</button><button class="btn primary" id="modalOk">확인</button></div></dialog>
<div id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/contrib/auto-render.min.js"></script>

<script src="./quiz-db.js"></script>
<script src="./script.js"></script>
</body></html>
