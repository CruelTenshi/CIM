<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b101a">
<title>문제 풀이</title>
<style>
:root{color-scheme:dark;--bg:#0b101a;--panel:#121a28;--panel2:#192335;--line:#2a364c;--text:#edf2fc;--muted:#9daec6;--accent:#9cafff;--green:#64ddba;--red:#ff969d;--yellow:#ffd48a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.7;word-break:keep-all}
button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
header{border-bottom:1px solid var(--line);background:#101724;padding:27px max(24px,calc((100vw - 1240px)/2))}
.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:2.2px}h1{font-size:clamp(24px,3.5vw,36px);line-height:1.3;letter-spacing:-1.2px;margin:9px 0}
.sub{margin:8px 0 0;color:var(--muted);font-size:14px}.topmeta{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}
.chip{font-size:12px;background:#1c2638;color:#bfcdf0;border:1px solid #303e56;padding:3px 10px;border-radius:5px}
.shell{max-width:1288px;margin:28px auto;padding:0 24px;display:grid;grid-template-columns:275px minmax(0,1fr);gap:26px;align-items:start}
aside{position:sticky;top:20px}.panel,.card{border:1px solid var(--line);background:var(--panel);border-radius:14px}.panel{padding:19px}.side-title{font-size:14px;font-weight:700;margin:0}.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:13px 0 6px}
progress{width:100%;height:6px;display:block;accent-color:var(--accent);border:0;border-radius:4px;overflow:hidden}progress::-webkit-progress-bar{background:#283246}progress::-webkit-progress-value{background:var(--accent)}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:17px}
.navq{position:relative;height:36px;padding:0;border-radius:6px;border:1px solid var(--line);background:#0e1623;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.navq.answered{background:#273556;color:#d4deff;border-color:#455781}.navq.current{outline:2px solid var(--accent);outline-offset:1px;color:white}
.navq.flagged:after{content:"";position:absolute;right:4px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--yellow)}
.navq.correct{background:#163a35;color:var(--green);border-color:#2e6154}.navq.wrong{background:#422632;color:var(--red);border-color:#74444b}
.legend{color:var(--muted);font-size:11px;margin:13px 0 17px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{padding:10px 16px;border-radius:7px;border:1px solid var(--line);color:var(--text);background:var(--panel2);font-size:13px;font-weight:650}
.btn:hover:not(:disabled){filter:brightness(1.18)}.primary{background:#a8b8ff;color:#111a31;border-color:#a8b8ff}.danger{color:var(--red)}.wide{width:100%}.subtle{color:var(--muted);background:transparent}
.sidefoot{margin-top:13px;color:var(--muted);font-size:11px}.clock{font-variant-numeric:tabular-nums}
#filters{margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap}.filter{font-size:12px;padding:6px 13px;border-radius:20px;color:var(--muted);background:transparent;border:1px solid var(--line)}.filter.active{background:#273556;border-color:var(--accent);color:#e3e8ff}
.card{overflow:hidden}.cardhead{padding:21px 27px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.qnum{font-weight:750;font-size:14px}.small{font-size:12px;color:var(--muted)}.tag{color:var(--accent);font-size:12px}
.flag{background:transparent;border:1px solid var(--line);padding:6px 11px;border-radius:6px;color:var(--muted);font-size:12px}.flag.on{color:var(--yellow);border-color:#887243;background:#302b24}
.qbody{padding:27px}.qtitle{font-size:19px;font-weight:680;line-height:1.8;margin:0 0 22px;letter-spacing:-.3px}.box{background:#0c1421;border:1px solid #35435b;border-left:3px solid var(--accent);border-radius:6px;padding:17px 19px;white-space:pre-line;font-size:14px;margin:0 0 24px;line-height:1.9}
.options{display:grid;gap:11px}.option{width:100%;display:flex;align-items:flex-start;gap:14px;text-align:left;background:#101827;color:var(--text);padding:15px 17px;border:1px solid var(--line);border-radius:9px;font-size:14px;line-height:1.8}
.option:hover:not(:disabled){border-color:#687ca5;background:#1a253a}.option.selected{background:#222f4c;border-color:var(--accent)}.option:disabled{opacity:1;cursor:default}
.opnum{flex:0 0 27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1px solid #46516a;color:var(--muted);font-size:12px;margin-top:0px}.selected .opnum{background:var(--accent);color:#10162b;border-color:var(--accent)}
.option.right{border-color:#4cad91;background:#15332f}.option.right .opnum{color:#102d27;background:var(--green);border-color:var(--green)}.option.incorrect{background:#38212c;border-color:#c16f80}.option.incorrect .opnum{background:var(--red);color:#3e1222;border-color:var(--red)}
.optext{flex:1}.oplabel{font-size:11px;font-weight:800;margin-left:6px;white-space:nowrap}.qfoot{padding:17px 27px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.qfoot .row{flex-wrap:nowrap}
.explanation{margin-top:25px;border:1px solid #34534f;background:#112724;border-radius:9px;padding:20px}.explanation.bad{border-color:#62434c;background:#251e29}
.exphead{font-weight:750;color:var(--green);font-size:14px}.bad .exphead{color:var(--red)}.explanation p{font-size:14px;margin:12px 0;line-height:1.95}.ref{color:var(--muted);font-size:12px}
#summary{margin-bottom:20px}.result{border:1px solid #53658f;background:linear-gradient(130deg,#202d4d,#142431);border-radius:14px;padding:25px}.resulttop{display:flex;justify-content:space-between;align-items:center;gap:20px}.score{font-size:44px;font-weight:800;color:#cfdaff;letter-spacing:-1.5px}.score small{font-size:16px;color:var(--muted);letter-spacing:0}.result h2{margin:0;font-size:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}.stat{background:#0c152588;border-radius:7px;padding:10px 12px}.stat span{display:block;font-size:11px;color:var(--muted)}.stat strong{font-size:19px}
details.notes{margin-top:22px;border:1px solid var(--line);border-radius:10px;padding:16px 20px;color:var(--muted);font-size:12px}summary{cursor:pointer;color:#c1cce0;font-weight:600}.notes p{margin:12px 0}.notes ul{padding-left:20px}.notes li{margin:7px 0}.notice{color:var(--muted);font-size:12px;margin-top:15px}.empty{padding:40px;text-align:center;color:var(--muted)}
dialog{border:1px solid #4a5d82;border-radius:13px;background:var(--panel);color:var(--text);max-width:440px;width:calc(100% - 40px);padding:26px}dialog::backdrop{background:#030714cc}dialog h2{font-size:20px;margin:0 0 12px}dialog p{font-size:14px;color:var(--muted)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#d9e2ff;color:#14203a;padding:10px 20px;border-radius:7px;font-size:13px;z-index:10;box-shadow:0 8px 40px #0007;max-width:90vw}
.topicresults{margin:16px 0;font-size:12px;color:#bdcae3;display:flex;flex-wrap:wrap;gap:6px 16px}
@media(max-width:850px){.shell{grid-template-columns:1fr;padding:0 16px;margin:20px auto;gap:19px}aside{position:static}.navgrid{grid-template-columns:repeat(10,1fr);gap:6px}.navq{height:31px}.panel{padding:16px}.legend,.sidefoot{display:none}.sideactions{display:flex;gap:8px}.sideactions .wide{width:auto;flex:1}.sideactions .row{flex:1;margin-top:0!important}.cardhead,.qbody,.qfoot{padding:19px}.qtitle{font-size:18px}header{padding:25px 20px}.topmeta{gap:6px}.stats{gap:6px}.stat{padding:8px}.score{font-size:36px}}
@media(max-width:460px){.navgrid{grid-template-columns:repeat(8,1fr)}.qfoot{flex-wrap:wrap}.qfoot>.row{margin-left:auto}.option{padding:13px;gap:10px}.result{padding:19px}.resulttop{align-items:flex-start}.score{font-size:30px}.stats{grid-template-columns:repeat(2,1fr)}.qtitle{font-size:17px}.sideactions{flex-wrap:wrap}.sideactions>.wide{flex-basis:100%}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}.card{animation:enter .18s ease-out}@keyframes enter{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}}

[hidden]{display:none!important}
.bank-picker{max-width:1050px;margin:32px auto;padding:0 24px}
.bank-picker h2{margin:0 0 6px;font-size:23px}
.bank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px;margin:24px 0}
.bank-card{padding:25px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:flex-start}
.bank-card h3{margin:0 0 9px;font-size:21px}.bank-card code{color:var(--green);overflow-wrap:anywhere}
.bank-card p{flex:1;margin:13px 0 20px}.bank-card .btn{width:100%}
.bank-help{padding:16px 20px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:13px}
#bankStatus{color:var(--yellow);min-height:28px;overflow-wrap:anywhere}
.backbar{max-width:1288px;margin:22px auto -10px;padding:0 24px}
#bankHeading:focus{outline:none}

</style>
</head>
<body>
<header>
<div class="eyebrow" id="quizEyebrow"></div>
<h1 id="quizTitle"></h1>
<p class="sub" id="quizSubtitle"></p>
<div class="topmeta" id="quizChips"></div>
</header>
<section id="bankPicker" class="bank-picker" aria-labelledby="bankHeading">
<h2 id="bankHeading" tabindex="-1">어떤 문제집을 풀까요?</h2>
<p class="small">문제집을 선택하면 바로 시작합니다. 이전에 풀었다면 저장된 상태를 이어서 엽니다.</p>
<div id="bankList" class="bank-grid"></div>
<p id="bankStatus" role="status" aria-live="polite"></p>
<div class="bank-help">해당 웹페이지 및 문제는 AI를 통해 제작되었습니다. 문제에 오류가 있을 수 있음에 유의하십시오.</div>
</section>
<div id="quizView" hidden>
<div class="backbar"><button type="button" class="btn subtle" id="backToBanks">← 뒤로 가기 · 문제집 선택</button></div>
<div class="shell">
<aside><div class="panel">
<h2 class="side-title" id="sideTitle">풀이 현황</h2>
<div class="meta"><span id="progressText"></span><span class="clock" id="clock">00:00</span></div>
<progress id="progress" max="1" value="0" aria-label="응답 진행률"></progress>
<nav id="nav" class="navgrid" aria-label="문항 바로가기"></nav>
<div class="legend">채운 칸: 응답 완료 · 노란 점: 다시 확인<br>테두리: 현재 문항 · 제출 전 정답 비공개</div>
<div class="sideactions">
<button class="btn primary wide" id="submitBtn">답안 제출 · 채점</button>
<div class="row" style="margin-top:9px"><button class="btn subtle" id="resetBtn">전체 초기화</button><button class="btn subtle" id="exportBtn">결과 저장</button></div>
</div>
<div class="sidefoot" id="saveStatus">이 브라우저에 자동 저장합니다.<br>키보드 1~4: 답 선택 · ← →: 문항 이동<br>시간은 창이 보이는 동안만 누적됩니다.</div>
</div></aside>
<main>
<section id="summary" aria-label="채점 결과" hidden></section>
<div id="filters" aria-label="문항 필터"></div>
<div id="question" aria-live="polite"></div>
<div id="quizNotes"></div>
<p class="notice" id="quizNotice"></p>
</main></div>
</div>
<dialog id="modal"><h2 id="modalTitle"></h2><p id="modalBody"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="modalCancel">취소</button><button class="btn primary" id="modalOk">확인</button></div></dialog>
<div id="toast" role="status" hidden></div>
<script src="./quiz-banks.js"></script>
<script>

"use strict";
const bankDefaults=[
  {file:"questions.js",title:"문제집 1",description:"questions.js에 저장된 문제"},
  {file:"questions2.js",title:"문제집 2",description:"questions2.js에 저장된 문제"}
];
const banks=Array.isArray(window.QUIZ_BANKS)?window.QUIZ_BANKS:bankDefaults;
let disposeCurrent=null, loadingBank=false, loadedScript=null;
const el=id=>document.getElementById(id);
function showSelection(){
  if(loadingBank)return;
  if(disposeCurrent){disposeCurrent();disposeCurrent=null;}
  el("quizView").hidden=true;
  el("bankPicker").hidden=false;
  el("quizTitle").textContent="문제집 선택";
  el("quizEyebrow").textContent="QUESTION BANK / SELECT";
  el("quizSubtitle").textContent="풀고 싶은 문제 DB를 선택하세요. 풀이 상태는 문제집별로 따로 저장됩니다.";
  el("quizChips").replaceChildren();
  document.title="문제집 선택";
  el("bankStatus").textContent="";
  window.scrollTo({top:0,behavior:"instant"});
  el("bankHeading").focus({preventScroll:true});
}
function drawBanks(){
  el("bankList").replaceChildren();
  banks.forEach((bank,index)=>{
    if(!bank||typeof bank.file!=="string")return;
    const card=document.createElement("article");card.className="bank-card";
    const title=document.createElement("h3");title.textContent=bank.title||bank.file;
    const desc=document.createElement("p");desc.className="small";desc.textContent=bank.description||"선택하면 저장된 풀이 상태를 이어서 엽니다.";
    const button=document.createElement("button");button.type="button";button.className="btn primary";
    button.textContent="선택 · 문제 풀기";button.dataset.bank=String(index);
    button.onclick=()=>loadBank(bank,button);
    card.append(title,desc,button);el("bankList").appendChild(card);
  });
  if(!el("bankList").children.length)el("bankStatus").textContent="등록된 문제집이 없습니다. quiz-banks.js에 문제집을 추가하세요.";
}
async function loadBank(bank,button){
  if(loadingBank)return;
  loadingBank=true;
  el("bankList").querySelectorAll("button").forEach(b=>b.disabled=true);
  el("bankStatus").textContent=bank.file+" 불러오는 중…";
  const originalLabel=button.textContent;button.textContent="불러오는 중…";
  try{
    if(loadedScript){loadedScript.remove();loadedScript=null;}
    delete window.QUIZ_DATA;
    await new Promise((resolve,reject)=>{
      const script=document.createElement("script");
      script.src="./"+bank.file.replace(/^\.\//,"");
      script.onload=resolve;
      script.onerror=()=>reject(new Error("파일을 읽을 수 없습니다."));
      loadedScript=script;document.body.appendChild(script);
    });
    const data=window.QUIZ_DATA;
    if(!data||!Array.isArray(data.questions)||!data.questions.length)
      throw new Error("window.QUIZ_DATA에 유효한 문제 데이터가 없습니다.");
    el("saveStatus").innerHTML="이 브라우저에 문제집별로 자동 저장합니다.<br>키보드 1~4: 답 선택 · ← →: 문항 이동<br>시간은 창이 보이는 동안만 누적됩니다.";
    disposeCurrent=initQuiz(data,bank);
    el("bankPicker").hidden=true;el("quizView").hidden=false;
    window.scrollTo({top:0,behavior:"instant"});
    el("backToBanks").focus({preventScroll:true});
  }catch(error){
    el("bankStatus").textContent=bank.file+"을(를) 불러오지 못했습니다. HTML과 같은 폴더에 해당 파일이 있는지, window.QUIZ_DATA 형식인지 확인하세요. ("+error.message+")";
    el("quizView").hidden=true;el("bankPicker").hidden=false;
    el("quizTitle").textContent="문제집 선택";document.title="문제집 선택";
  }finally{
    loadingBank=false;button.textContent=originalLabel;
    el("bankList").querySelectorAll("button").forEach(b=>b.disabled=false);
  }
}
el("backToBanks").onclick=showSelection;
drawBanks();
showSelection();

function initQuiz(data,bank){

const quizData = data;
if (!quizData || !Array.isArray(quizData.questions) || !quizData.questions.length) {
  document.getElementById("question").textContent = "문제 데이터를 불러오지 못했습니다. questions.js가 HTML과 같은 폴더에 있는지 확인하세요.";
  throw new Error("유효한 questions.js가 필요합니다.");
}
const questions = quizData.questions;
const meta = quizData.meta || {};
const ids = new Set();
for (const q of questions) {
  if (!Number.isInteger(q.id) || q.id < 1 || ids.has(q.id) ||
      !Array.isArray(q.options) || q.options.length !== 4 ||
      !q.options.every(v => typeof v === "string") ||
      !Number.isInteger(q.answer) || q.answer < 0 || q.answer > 3 ||
      !["topic", "kind", "stem", "explain"].every(k => typeof q[k] === "string") ||
      !Array.isArray(q.pages) || !(q.box == null || typeof q.box === "string")) {
    document.getElementById("question").textContent = "문제 데이터 형식에 오류가 있습니다. questions.js를 확인하세요.";
    throw new Error("잘못된 문항 또는 중복 id: " + q.id);
  }
  ids.add(q.id);
}
const questionMap = new Map(questions.map(q => [q.id, q]));
const fillCount = value => String(value || "").replaceAll("{count}", questions.length);
document.title = fillCount(meta.documentTitle || meta.title || "문제 풀이");
document.getElementById("quizTitle").textContent = meta.title || "문제 풀이";
document.getElementById("quizEyebrow").textContent = meta.eyebrow || "";
document.getElementById("quizSubtitle").textContent = meta.subtitle || "";
document.getElementById("quizChips").replaceChildren();
for (const text of meta.chips || []) {
  const chip = document.createElement("span");
  chip.className = "chip"; chip.textContent = fillCount(text);
  document.getElementById("quizChips").appendChild(chip);
}
const distribution = [0, 1, 2, 3].map(i => `${["①","②","③","④"][i]} ${questions.filter(q => q.answer === i).length}개`).join(" · ");
document.getElementById("quizNotes").innerHTML = fillCount(meta.notesHTML || "").replaceAll("{answerDistribution}", "정답 분포: " + distribution + ".");
document.getElementById("quizNotice").textContent = fillCount(meta.notice || "");
// 데이터가 바뀌면 이전 정답·채점 상태를 잘못 복원하지 않습니다.
const dataSignature = JSON.stringify(questions);

const KEY="quiz_bank_v2:" + encodeURIComponent(bank.file) + ":" + (meta.storageKey || "quiz_default_v1");
const $=id=>document.getElementById(id);
const all=questions.map(q=>q.id);
const fresh=()=>({answers:{},flags:{},submitted:false,current:all[0],scope:[...all],filter:"all",seconds:0,attempt:1});
let state=fresh(), canSave=true;
try{
const stored=JSON.parse(localStorage.getItem(KEY)||"null");
if(stored&&stored.version===1&&stored.state&&(!stored.dataSignature||stored.dataSignature===dataSignature)){
 const s=stored.state;
 if(Array.isArray(s.scope)&&s.scope.length&&s.scope.every(id=>all.includes(id))&&s.answers&&s.flags){
 state={...fresh(),...s};
 state.scope=[...new Set(s.scope)];
 if(!state.scope.includes(state.current))state.current=state.scope[0];
 if(!["all","unanswered","flagged","wrong","correct"].includes(state.filter))state.filter="all";
 for(const id of Object.keys(state.answers))if(!all.includes(Number(id))||![0,1,2,3].includes(state.answers[id]))delete state.answers[id];
 state.seconds=Number.isFinite(state.seconds)?Math.max(0,state.seconds):0;
 }
}
}catch(e){canSave=false}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:1,dataSignature,state}));}catch(e){canSave=false;$("saveStatus").textContent="이 환경에서는 자동 저장이 제한됩니다. 결과 저장을 이용하세요.";}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const getQ=id=>questionMap.get(id);
const hasAnswer=id=>Number.isInteger(state.answers[id]);
const isCorrect=id=>state.answers[id]===getQ(id).answer;
function visibleIDs(){return state.scope.filter(id=>{
 if(state.filter==="unanswered")return !hasAnswer(id);
 if(state.filter==="flagged")return !!state.flags[id];
 if(state.filter==="wrong")return !isCorrect(id);
 if(state.filter==="correct")return isCorrect(id);
 return true;
});}
function timeText(){const n=Math.floor(state.seconds);return `${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;}
function toast(message){$("toast").textContent=message;$("toast").hidden=false;setTimeout(()=>$("toast").hidden=true,2500);}
function showModal(title,body,action,label="확인"){
 $("modalTitle").textContent=title;$("modalBody").textContent=body;$("modalOk").textContent=label;
 $("modalOk").onclick=()=>{$("modal").close();action();};
 $("modal").showModal();
}
$("modalCancel").onclick=()=>$("modal").close();
function render(){
 const ids=visibleIDs();
 if(ids.length&&!ids.includes(state.current))state.current=ids[0];
 const done=state.scope.filter(hasAnswer).length;
 $("progressText").textContent=state.submitted?`${state.scope.length}문항 채점 완료`:`${done} / ${state.scope.length} 응답`;
 $("progress").max=state.scope.length;$("progress").value=state.submitted?state.scope.length:done;
 $("clock").textContent=timeText();
 $("sideTitle").textContent=state.submitted?"채점 · 문항 탐색":(state.attempt>1?`재도전 ${state.attempt-1}회차`:"풀이 현황");
 $("nav").innerHTML=state.scope.map(id=>{
 const status=state.submitted?(isCorrect(id)?"correct":"wrong"):(hasAnswer(id)?"answered":"");
 const hidden=!ids.includes(id);
 return `<button class="navq ${status} ${id===state.current&&!hidden?"current":""} ${state.flags[id]?"flagged":""}" data-goto="${id}" aria-label="${id}번 ${state.submitted?(isCorrect(id)?"정답":"오답"):hasAnswer(id)?"응답 완료":"미응답"}${state.flags[id]?", 다시 확인":""}" ${id===state.current?'aria-current="true"':""}>${id}</button>`;
 }).join("");
 const filters=state.submitted?[["all","전체"],["wrong","오답 · 미응답"],["correct","정답"],["flagged","다시 확인"]]:[["all","전체"],["unanswered","미응답"],["flagged","다시 확인"]];
 if(!filters.some(f=>f[0]===state.filter)){state.filter="all";return render();}
 $("filters").innerHTML=filters.map(([v,label])=>`<button class="filter ${state.filter===v?"active":""}" aria-pressed="${state.filter===v}" data-filter="${v}">${label}</button>`).join("");
 $("submitBtn").hidden=state.submitted;
 $("summary").hidden=!state.submitted;
 if(state.submitted)renderSummary();
 if(!ids.length){
 $("question").innerHTML='<div class="card empty">이 조건에 해당하는 문항이 없습니다.<br>다른 필터를 선택하세요.</div>';persist();return;
 }
 const q=getQ(state.current), selected=state.answers[q.id], correct=q.answer;
 $("question").innerHTML=`<article class="card">
 <div class="cardhead"><div><div class="qnum">QUESTION ${String(q.id).padStart(2,"0")} <span class="small">/ ${questions.length}</span></div><div class="tag">${escapeHTML(q.topic)} <span class="small">· ${escapeHTML(q.kind)}</span></div></div><button class="flag ${state.flags[q.id]?"on":""}" id="flagBtn" aria-pressed="${!!state.flags[q.id]}">${state.flags[q.id]?"★ 확인 표시됨":"☆ 다시 확인"}</button></div>
 <div class="qbody"><h2 class="qtitle" id="stem">${escapeHTML(q.stem)}</h2>
 ${q.box?`<div class="box">${escapeHTML(q.box)}</div>`:""}
 <div class="options" role="group" aria-labelledby="stem">${q.options.map((o,i)=>{
 let cls=selected===i?"selected":"";
 if(state.submitted){if(i===correct)cls+=" right";else if(selected===i)cls+=" incorrect";}
 return `<button class="option ${cls}" data-answer="${i}" aria-pressed="${selected===i}" ${state.submitted?"disabled":""}><span class="opnum">${i+1}</span><span class="optext">${escapeHTML(o)}${state.submitted&&i===correct?'<span class="oplabel">정답</span>':""}${state.submitted&&selected===i&&i!==correct?'<span class="oplabel">내 선택</span>':""}</span></button>`;
 }).join("")}</div>
 ${state.submitted?`<section class="explanation ${isCorrect(q.id)?"":"bad"}"><div class="exphead">${isCorrect(q.id)?"정답입니다":"미응답"===(!hasAnswer(q.id)?"미응답":"")?"미응답 · 오답 처리":"다시 짚어보세요"} · 정답 ${correct+1}번${hasAnswer(q.id)?` / 내 답 ${selected+1}번`:""}</div><p>${escapeHTML(q.explain)}</p><div class="ref">근거 범위 · 제공 PDF p.${q.pages.join(", ")}${q.kind==="계산"||q.kind==="숫자 빈칸"?" · 수치는 연습용 재구성":""}</div></section>`:""}
 </div>
 <div class="qfoot"><span class="small">${ids.indexOf(q.id)+1} / ${ids.length} 문항${state.filter!=="all"?" · 필터 적용":""}</span><div class="row">${!state.submitted?'<button class="btn subtle" id="clearBtn">선택 해제</button>':""}<button class="btn" id="prevBtn" ${ids.indexOf(q.id)===0?"disabled":""}>이전</button><button class="btn primary" id="nextBtn" ${ids.indexOf(q.id)===ids.length-1?"disabled":""}>다음 →</button></div></div>
 </article>`;
 $("flagBtn").onclick=()=>{state.flags[q.id]=!state.flags[q.id];render();};
 if($("clearBtn"))$("clearBtn").onclick=()=>{delete state.answers[q.id];render();};
 $("prevBtn").onclick=()=>move(-1);$("nextBtn").onclick=()=>move(1);
 persist();
}
function renderSummary(){
 const n=state.scope.length,c=state.scope.filter(isCorrect).length,u=state.scope.filter(id=>!hasAnswer(id)).length;
 const topics=[...new Set(state.scope.map(id=>getQ(id).topic))];
 $("summary").innerHTML=`<div class="result"><div class="eyebrow">YOUR PERFORMANCE · ${state.attempt===1?"FIRST RUN":"RETRY "+(state.attempt-1)}</div><div class="resulttop"><div><h2>풀이를 마쳤습니다.</h2><div class="small">${state.attempt===1?`전 범위 ${questions.length}문항`:"재도전 "+n+"문항"} · 소요 ${timeText()}</div></div><div class="score">${Math.round(c/n*1000)/10}<small> / 100</small></div></div>
 <div class="stats"><div class="stat"><span>정답</span><strong style="color:var(--green)">${c}</strong></div><div class="stat"><span>오답 · 미응답</span><strong style="color:var(--red)">${n-c}</strong></div><div class="stat"><span>미응답</span><strong>${u}</strong></div><div class="stat"><span>전체 문항</span><strong>${n}</strong></div></div>
 <div class="topicresults">${topics.map(t=>{const a=state.scope.filter(id=>getQ(id).topic===t);return `<span>${escapeHTML(t)} ${a.filter(isCorrect).length}/${a.length}</span>`;}).join("")}</div>
 <div class="row"><button class="btn primary" id="retryBtn" ${c===n?"disabled":""}>오답만 다시 풀기 (${n-c})</button><button class="btn" id="allRetryBtn">전체 ${questions.length}문항 새로 풀기</button></div></div>`;
 $("retryBtn").onclick=()=>{
 const wrong=state.scope.filter(id=>!isCorrect(id));
 if(!wrong.length)return;
 showModal("오답 재도전",`${wrong.length}문항의 응답을 지우고 다시 풉니다. 현재 채점 결과를 보관하려면 먼저 ‘결과 저장’을 이용하세요.`,()=>start(wrong),"다시 풀기");
 };
 $("allRetryBtn").onclick=()=>resetConfirm();
}
function start(scope){const attempt=state.attempt+1;state={...fresh(),scope:[...scope],current:scope[0],attempt};render();window.scrollTo({top:0,behavior:"smooth"});}
function resetConfirm(){showModal("전체 풀이 초기화",`현재 답안·확인 표시·시간을 지우고 전체 ${questions.length}문항을 새로 풉니다. 저장한 결과 파일에는 영향이 없습니다.`,()=>{state=fresh();render();window.scrollTo({top:0,behavior:"smooth"});},"초기화");}
function move(dir){const ids=visibleIDs(),idx=ids.indexOf(state.current),next=ids[idx+dir];if(next){state.current=next;render();}}
$("nav").onclick=e=>{const b=e.target.closest("[data-goto]");if(!b)return;const id=Number(b.dataset.goto);if(!visibleIDs().includes(id))state.filter="all";state.current=id;render();};
$("filters").onclick=e=>{const b=e.target.closest("[data-filter]");if(b){state.filter=b.dataset.filter;render();}};
$("question").onclick=e=>{const b=e.target.closest("[data-answer]");if(!b||state.submitted)return;state.answers[state.current]=Number(b.dataset.answer);render();};
$("submitBtn").onclick=()=>{
 const u=state.scope.filter(id=>!hasAnswer(id)).length;
 showModal("답안을 제출할까요?",u?`아직 ${u}문항에 응답하지 않았습니다. 미응답은 오답으로 채점되며, 제출 후 모든 해설이 공개됩니다.`:"제출하면 답안이 확정되고 정답과 해설이 공개됩니다.",()=>{state.submitted=true;state.filter="all";render();window.scrollTo({top:0,behavior:"smooth"});},"제출 · 채점");
};
$("resetBtn").onclick=resetConfirm;
$("exportBtn").onclick=()=>{
 if(!state.submitted){toast("제출 · 채점 후 결과를 저장할 수 있습니다.");return;}
 const correct=state.scope.filter(isCorrect).length;
 const lines=[`${meta.title || "문제 풀이"} · 학습 결과`,`문항 수: ${state.scope.length} / 정답: ${correct} / 점수: ${Math.round(correct/state.scope.length*1000)/10}점`,`풀이 시간: ${timeText()}`,"",...state.scope.flatMap(id=>{
 const q=getQ(id);
 return [`[${id}번] ${q.topic} · ${isCorrect(id)?"정답":hasAnswer(id)?"오답":"미응답"}`,q.stem,...(q.box?[q.box]:[]),...q.options.map((v,i)=>`${i+1}. ${v}`),`내 답: ${hasAnswer(id)?state.answers[id]+1:"미응답"} / 정답: ${q.answer+1}`,`해설: ${q.explain}`,`근거 범위: PDF p.${q.pages.join(", ")}`,""];
 })];
 const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/plain;charset=utf-8"});
 const a=document.createElement("a"),url=URL.createObjectURL(blob);a.href=url;a.download=meta.exportFilename || "quiz_results.txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
const onQuizKeydown=e=>{
 if($("modal").open||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;
 if(["1","2","3","4"].includes(e.key)&&!state.submitted&&visibleIDs().length){state.answers[state.current]=Number(e.key)-1;render();e.preventDefault();}
 if(e.key==="ArrowLeft"){move(-1);e.preventDefault();}
 if(e.key==="ArrowRight"){move(1);e.preventDefault();}
};
document.addEventListener("keydown",onQuizKeydown);
const clockTimer=setInterval(()=>{if(!state.submitted&&!document.hidden){state.seconds++;$("clock").textContent=timeText();if(state.seconds%5===0)persist();}},1000);
window.addEventListener("pagehide",persist);
render();
if(!canSave)$("saveStatus").textContent="이 환경에서는 자동 저장이 제한될 수 있습니다.";
return function disposeQuiz(){
  persist();
  clearInterval(clockTimer);
  document.removeEventListener("keydown",onQuizKeydown);
  window.removeEventListener("pagehide",persist);
  if($("modal").open)$("modal").close();
  $("modalOk").onclick=null;
};


}

</script>
</body></html>
